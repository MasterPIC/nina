name: Build NINA (fork)

on:
  workflow_dispatch:

env:
  BUILD_CONFIG: SignedRelease

jobs:
  build:
    name: Build NINA
    runs-on: windows-latest

    steps:
    - name: Checkout repository (LFS + submodules)
      uses: nschloe/action-cached-lfs-checkout@v1
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Set up .NET 10.0 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Install MkDocs and plugins
      run: |
        python -m pip install --upgrade pip
        pip install mkdocs mkdocs-material

    - name: Install WiX Toolset 4
      run: |
        dotnet tool install --global wix --version 4.0.5
        wix --version

    - name: Install Pandoc
      run: choco install pandoc -y

    - name: Restore NuGet packages
      run: dotnet restore NINA.sln

    - name: Generate release notes
      run: |
        pandoc RELEASE_NOTES.md -f markdown -t rtf -s -o RELEASE_NOTES.rtf
        pandoc RELEASE_NOTES.md -f markdown -t html -s -o RELEASE_NOTES.html

    - name: Build NINA
      run: dotnet build NINA\NINA.csproj -c ${{ env.BUILD_CONFIG }} -r win-x64  /p:AllowUnsafeBlocks=true

    - name: Build MkDocs documentation
      run: mkdocs build -f NINA.Docs\mkdocs-nopdf.yml -c

    - name: Copy docs to build output
      shell: cmd
      run: |
        mkdir NINA\bin\${{ env.BUILD_CONFIG }}\net10.0-windows\win-x64\docs
        xcopy NINA.Docs\site NINA\bin\${{ env.BUILD_CONFIG }}\net10.0-windows\win-x64\docs /h/i/c/k/e/r/y

    - name: Build WiX Setup Bundle
      run: dotnet msbuild NINA.SetupBundle\NINA.SetupBundle.wixproj /p:Configuration=${{ env.BUILD_CONFIG }} /p:Platform=x64

    - name: Create installer ZIP
      run: |
        Compress-Archive `
          NINA.SetupBundle\bin\x64\${{ env.BUILD_CONFIG }}\*.exe `
          NINASetupBundle.zip

    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: NINA-installer
        path: NINASetupBundle.zip
